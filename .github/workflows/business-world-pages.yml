name: Deploy Business World Flows to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/business-world-flows/**'
      - '.github/workflows/business-world-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: business-world-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/business-world-flows
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
